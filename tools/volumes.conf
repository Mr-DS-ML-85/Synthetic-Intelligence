# volumes.conf — Zenodo deposition manifest.
#
# Each volume is one citable deposition. Format:
#
#   [volume-slug]
#   title:  <full title>
#   blurb:  <one-line description for the volume front matter>
#   papers: <space-separated paths relative to research-paper/>
#
# EVERY paper in research-paper/ belongs to exactly one volume. The
# build refuses to run if that invariant is broken, because a paper
# silently belonging to none is how an archive loses work.

[00-central]
title:  From Artificial to Synthetic Intelligence — Principles of Constructive Structural Cognition
blurb:  The framework paper. Read this first; every other volume is a companion to it.
papers: synthetic-intelligence.md

[01-substrate]
title:  The Physics Substrate — Cavities, Materials, Oscillators and Gating
blurb:  Layer 1. How a concept becomes a mechanical object and a relation becomes a material.
papers: prm.md cmd.md mims.md hnca.md ntda.md tsda.md srg.md

[02-emission]
title:  Emission and Readout — Phase, Momentum, Gauge and Metastability
blurb:  How a settled field becomes an ordered output, and the mechanisms that stop it locking.
note:   **The emission problem is only half solved, and the two halves are easy to confuse.**\n\n**MRS** (`mrs.md`) has a *recognition* half and an *emission* half. Recognition works: bigram sensory lanes survive misspellings and transpositions at 7/7 measured. Emission **babbles** and is retired. Citing MRS as a working generator misreports it.\n\n**Concept-level ordering works; byte-level does not.** CPME's phase-collapse sweep and CPSB's gauge offsets order *which concept follows which*, and that holds. Producing the *bytes of a word* is unsolved, and the Language volume argues that for grammar the question was mis-stated rather than merely hard.\n\n**CSAT** is opt-in and off by default.
papers: mcpe.md htr.md cpme.md cpme_ii.md cpsb.md vght.md CSAT.md mrs.md

[03-structure]
title:  Structural Construction — Contradiction, Fission, Mutation and Geometry
blurb:  Layer 2. What the engine does when its current structure cannot hold what it knows.
note:   **`rb.md` is a precursor, not a result.** Resonant Bifurcation states the fission mechanism without the controls that proved necessary — no generational cap, no alias ledger, no energy-conserving fan-out, no audit trail, and no measurement. **Cite `rbg.md`** for the mechanism as implemented and for the 20-seed data. `rb.md` is included for priority of the idea only.\n\n**`CMA.md` here is *Conceptual Mutation Architecture*** and is live in `src/bisociation.hpp`. It is a different paper from the *Cognitive Manifold Architecture* in the Retrospective volume. The acronym collides.
papers: rb.md rbg.md rifa.md CMA.md graph_fisher.md liouville_analog.md cr_bound.md

[04-reasoning]
title:  Reasoning and Discovery — Derivation, Abduction and Runtime Acquisition
blurb:  Proof-passes over a truth graph, handling the unknown, and acquiring knowledge while running.
papers: RADE.md maa.md l9.md lto.md

[05-language]
title:  Constructive Language Locking — Separating Cognitive Freedom from Linguistic Protocol
blurb:  Why grammar cannot be discovered by physics, and what to do instead.
papers: cll.md

[06-epistemology]
title:  Einstein's Epistemology as a Running Architecture — Induction, Refutation and Impossibility
blurb:  The J-A-S cycle, and the register that records the warrant of every "cannot".
papers: jas.md

[07-consciousness]
title:  Bounded Self-Model Architecture — A Fixed-Point Theory of Phenomenal Structure
blurb:  Qualia as structural resistance in a graph that models itself. The most speculative volume.
papers: bmsa_new.md phenomenal-consciousness.md

[08-retrospective]
title:  Retrospective — The Retired DCHL Substrate and What Survived It
blurb:  A negative result and a salvage record. The architecture that failed, and the four mechanisms that outlived it.
note:   **Two hazards in this volume.**\n\n**The acronym CMA is overloaded.** `failed_but_parts_works/cma.md` here is *Cognitive Manifold Architecture*, retired. *Conceptual Mutation Architecture* is a different paper, is live, and appears in the Structure volume. An audit by filename concludes CMA is retired, which is false for one of the two.\n\n**The DCHL benchmark in this volume is historical.** The 539 M-parameter training run is reported as the evidence for *retiring* that substrate, not as a result of the current one. The current Layer 1 has no parameters, no gradients and no GPU path, so none of those numbers transfer.
papers: retrospective.md pcma.md failed_but_parts_works/README.md failed_but_parts_works/cch.md failed_but_parts_works/cma.md failed_but_parts_works/cmc.md failed_but_parts_works/cmc_extra.md failed_but_parts_works/cme.md failed_but_parts_works/hcma.md failed_but_parts_works/rifa.md

[09-dead]
title:  Dead and Deprecated — The Retired Archive
blurb:  Formally retired. Retained for provenance only. Not a description of any running system.
note:   **A dead paper is not a retracted one, and two papers in this volume describe mechanisms that are load-bearing today.**\n\n**ZeroGrad** (`zerograd.md`) is dead as an architecture — it trained the retired DCHL potential. Its *learning rule* is foundational: every Hebbian update in the current engine, including the phase-consistent extension, is `plasticity_delta = pd·hebbian_decay + plastic_rate·v_a·v_b`.\n\n**ANQ** (`anq.md`) is dead as a quantisation scheme, retired with the GPU trainer it served. One idea survived and is pervasive: replacing threshold-and-commit with a continuous saturating integrator, which is why the current tick loop contains exactly one branch.\n\nCite these two as **sources of mechanisms**, never as **descriptions of the system**. Everything else in this volume is dead in both senses. The full accounting is in the Retrospective volume.
papers: failed_but_parts_works/DEAD/README.md failed_but_parts_works/DEAD/bug_fix.md failed_but_parts_works/DEAD/future_fix.md failed_but_parts_works/DEAD/deprected/anq.md failed_but_parts_works/DEAD/deprected/bed.md failed_but_parts_works/DEAD/deprected/cb.md failed_but_parts_works/DEAD/deprected/cg.md failed_but_parts_works/DEAD/deprected/fixes.md failed_but_parts_works/DEAD/deprected/hmhra.md failed_but_parts_works/DEAD/deprected/hrm.md failed_but_parts_works/DEAD/deprected/omt.md failed_but_parts_works/DEAD/deprected/scer.md failed_but_parts_works/DEAD/deprected/zerograd.md
